<!DOCTYPE html>
<html>

<head>
    <title>Audio Test</title>
</head>

<body>
    <h1>Simple Audio Test</h1>
    <button onclick="playTest()">CLICK TO PLAY SOUND</button>

    <script>
        function playTest() {
            const audio = new Audio('sounds/click.mp3');
            console.log('Attempting to play: sounds/click.mp3');
            console.log('Current URL:', window.location.href);

            audio.play()
                .then(() => {
                    alert('✅ SUCCESS! Sound played!\n\nThis means:\n- Path is correct\n- Files are valid\n- Issue is in main.js logic');
                })
                .catch(error => {
                    alert('❌ ERROR!\n\n' + error.name + ': ' + error.message + '\n\nThis means:\n- Path might be wrong\n- Or browser blocking');
                    console.error('Playback error:', error);
                });
        }
    </script>
</body>

</html>
